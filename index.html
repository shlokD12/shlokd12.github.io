<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#050506" />
  <title>Shlok Das | Work in Progress</title>
  <style>
    :root {
      --bg: #050506;
      --text: #f6f2ea;
      --muted: rgba(246, 242, 234, 0.62);
      --line: rgba(246, 242, 234, 0.16);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow: hidden;
      background:
        radial-gradient(circle at 22% 18%, rgba(133, 88, 255, 0.2), transparent 28rem),
        radial-gradient(circle at 72% 42%, rgba(66, 190, 220, 0.16), transparent 30rem),
        radial-gradient(circle at 50% 115%, rgba(180, 138, 90, 0.1), transparent 22rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black, transparent 70%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background: linear-gradient(115deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: translateX(-45%) rotate(8deg);
      animation: drift 9s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translateX(-55%) rotate(8deg); }
      to { transform: translateX(35%) rotate(8deg); }
    }

    main {
      position: relative;
      width: min(960px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.025));
      backdrop-filter: blur(18px);
      padding: clamp(28px, 7vw, 72px);
      box-shadow: 0 30px 120px rgba(0,0,0,0.48);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: clamp(52px, 12vw, 140px);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 850px;
      font-size: clamp(3.4rem, 12vw, 9rem);
      line-height: 0.86;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    p {
      max-width: 600px;
      margin: clamp(28px, 5vw, 44px) 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.65;
    }

    .status {
      margin-top: clamp(42px, 8vw, 86px);
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: rgba(246, 242, 234, 0.74);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      body { padding: 16px; }
      main {
        min-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .meta { flex-direction: column; margin-bottom: 72px; }
    }
  </style>
</head>
<body>
  <main aria-label="Portfolio work in progress">
    <div class="meta">
      <span>Shlok Das</span>
      <span>Portfolio rebuild</span>
    </div>
    <h1>Work in progress.</h1>
    <p>
      This portfolio is currently offline while the full experience is being rebuilt.
      A new motion-led, 3D, and interactive visual system is in progress.
    </p>
    <div class="status">Revamp active / Back soon</div>
  </main>
</body>
</html>
